name: fetch-images
on:
  push:
    paths: ['.github/img-urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p assets/src
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL "$url" -o "assets/src/$name.png"
          done < .github/img-urls.txt
          ls -la assets/src
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/src
          git commit -m "Add generated menu photos [skip ci]" || echo nothing
          git push
