name: fetch
on:
  push:
    branches: [tools]
    paths: ['urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dl
          while IFS='|' read -r name url; do [ -z "$name" ] && continue; curl -fsSL "$url" -o "dl/$name.png" || echo "fail $name"; done < urls.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dl; git commit -m "fetched [skip ci]" || true; git push
